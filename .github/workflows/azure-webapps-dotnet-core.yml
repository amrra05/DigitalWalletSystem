
name: Deploy DigitalWallet API to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DigitalWallet.API/DigitalWallet.API.csproj

      - name: Build API
        run: dotnet build DigitalWallet.API/DigitalWallet.API.csproj --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish DigitalWallet.API/DigitalWallet.API.csproj --configuration Release --no-build --output ./publish

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: digitalwallet-api
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: digitalwallet-api
          path: ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: digitalwallet-amr-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
